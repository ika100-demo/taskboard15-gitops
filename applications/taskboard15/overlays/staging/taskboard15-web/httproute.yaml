apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskboard15-web
  labels:
    app: taskboard15-web
    app.kubernetes.io/name: taskboard15-web
    app.kubernetes.io/part-of: taskboard15
    app.kubernetes.io/managed-by: gitops-app
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: kube-system
  hostnames:
  - taskboard15-web.taskboard15-staging.localhost
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: taskboard15-web
      port: 80
